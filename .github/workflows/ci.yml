name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档时不跑整套构建。打 v* 标签不受 paths-ignore 影响（GitHub 规定
    # 标签推送不评估路径过滤），发版照常执行。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    # 和 main 上的规则一致：只改文档的 PR 不跑构建；代码和文档一起改仍会跑。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试（Linux）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # GPUI 在 Linux 上构建要链接这些系统库：字体走 freetype + fontconfig，
      # 输入走 xkbcommon，窗口走 wayland / xcb。少了任何一个 rustc 会在链接阶段报错。
      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev \
            libvulkan-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # 本工程的警告当错误处理。用 --config 指定而不是全局 RUSTFLAGS：
      # RUSTFLAGS 会连依赖一起编译，第三方代码的警告不归我们管也修不了。
      - name: 编译（警告当错误）
        run: |
          cargo build --locked --all-targets \
            --config 'build.rustflags=["-D","warnings"]'

      # XDG_CONFIG_HOME 必须指到没有 state.json 的目录：程序启动会读用户配置
      # 恢复模式和设置，读到本机残留会让一批界面测试按错的前提跑。
      - name: 跑测试
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          cargo test --locked --all-targets

  build:
    name: 构建（${{ matrix.name }}）
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 的脚本是 PowerShell，用 bash 去跑会报语法错误，
          # 所以下面打包那一步按平台分成了两条。
          - name: Linux
            os: ubuntu-24.04
            script: ./scripts/build-linux.sh
            artifact: dist/gistpic-creator-linux-x86_64.tar.gz
          - name: Windows
            os: windows-latest
            script: ./scripts/build-windows.ps1
            artifact: dist/gistpic-creator-windows-x64.zip
          - name: macOS
            os: macos-latest
            script: ./scripts/build-macos.sh
            artifact: dist/gistpic-creator-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 装系统依赖（Linux）
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev \
            libvulkan-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 打包（Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ${{ matrix.script }}

      - name: 打包（Linux / macOS）
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v7
        with:
          name: gistpic-creator-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Arch 包要用 makepkg 打，它只在 Arch 上才有，所以单独用官方容器跑一次。
  # 在 Ubuntu runner 上跑那个脚本只会生成 PKGBUILD，不产出安装包。
  archlinux:
    name: 构建（Arch Linux）
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: 装构建依赖
        run: |
          pacman -Syu --noconfirm
          # 用系统级 rust 包，不要用 rustup：rustup 只把 cargo 装到当前用户的
          # ~/.cargo/bin，换用户打包时 PATH 里找不到 cargo。
          pacman -S --noconfirm --needed \
            base-devel git rust \
            freetype2 fontconfig libxkbcommon libxkbcommon-x11 \
            wayland libxcb \
            vulkan-icd-loader vulkan-headers

      - uses: actions/checkout@v7

      # makepkg 明确拒绝以 root 运行（会直接报错退出），所以建一个普通用户来打包。
      # 构建目录要交给这个用户，否则它没有写权限。
      - name: 准备打包用户
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: 打包
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && ./scripts/build-arch.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: gistpic-creator-ArchLinux
          path: dist/archlinux/*.pkg.tar.zst
          if-no-files-found: error

  # 打 v* 标签时，把四个平台的包挂到 Release 上，供人直接下载。
  # 平时推 main 只上传到 Actions 页面，不发版。
  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, archlinux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 四个构建任务各自把自己那份 checked out 到 artifacts/ 下不同子目录。
      - name: 收集各平台产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 确认产物齐了
        run: |
          find artifacts -type f | sort
          echo "--- 产物数量 ---"
          find artifacts -type f | wc -l

      - name: 建 Release 并上传
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 同一个标签重复推时，先删掉旧 Release 再重建，避免报错中断。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，先删除"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false
          fi
          # 把三份便携包和一份 Arch 安装包按各自目录展平后一起上传。
          # 排除 Arch 的 debug 包：那是 makepkg 默认顺手产出的空壳，只有几 KB，
          # 用户不需要，挂着反而让人以为要装两个。
          files=$(find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.pkg.tar.zst' \) \
            ! -name '*-debug-*')
          echo "要上传的文件："
          echo "$files"
          # 一个都没找到就别建空 Release，直接失败，方便发现是哪个平台没产出。
          if [ -z "$files" ]; then
            echo "没有找到任何产物，不建 Release" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            $files

