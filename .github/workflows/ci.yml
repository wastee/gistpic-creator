name: CI

on:
  push:
    branches: [github]
    tags: ['v*']
  pull_request:
    branches: [github]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试（Linux）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GPUI 在 Linux 上构建要链接这些系统库：字体走 freetype + fontconfig，
      # 输入走 xkbcommon，窗口走 wayland / xcb。少了任何一个 rustc 会在链接阶段报错。
      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev \
            libvulkan-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # 本工程的警告当错误处理。用 --config 指定而不是全局 RUSTFLAGS：
      # RUSTFLAGS 会连依赖一起编译，第三方代码的警告不归我们管也修不了。
      - name: 编译（警告当错误）
        run: |
          cargo build --locked --all-targets \
            --config 'build.rustflags=["-D","warnings"]'

      # XDG_CONFIG_HOME 必须指到没有 state.json 的目录：程序启动会读用户配置
      # 恢复模式和设置，读到本机残留会让一批界面测试按错的前提跑。
      - name: 跑测试
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          cargo test --locked --all-targets

  build:
    name: 构建（${{ matrix.name }}）
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            script: ./scripts/build-linux.sh
            artifact: dist/gistpic-creator-linux-x86_64.tar.gz
          - name: Windows
            os: windows-latest
            script: ./scripts/build-windows.ps1
            artifact: dist/gistpic-creator-windows-x64.zip
          - name: macOS
            os: macos-latest
            script: ./scripts/build-macos.sh
            artifact: dist/gistpic-creator-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 装系统依赖（Linux）
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev \
            libvulkan-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 打包
        shell: bash
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: gistpic-creator-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
