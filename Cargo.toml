[package]
name = "video-screenshot"
version = "0.1.0"
edition = "2024"
publish = false
description = "视频截图：字幕拼接与图片排版"

[dependencies]
gpui = "0.2.2"
# 注意：libc 0.2.186+ 删掉了 Linux 上的 ENOATTR，gpui 依赖链里的 xattr 0.2.3 会编译失败；
# rustix 1.1.6 又要求 libc >= 0.2.182，所以固定在这个区间内。上游修复后可去掉。
libc = "=0.2.185"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
ocrs = "0.14"
rten = "0.28"
rten-imageproc = "0.28"
dirs = "7"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# 系统托盘：Linux 用纯 Rust 的 ksni 后端（走 D-Bus，不需要 GTK/libappindicator），
# Windows / macOS 用系统原生托盘。版本要求 Rust 1.90 以上。
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
zbus = "5"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

# macOS 上 GPUI 只会把窗口激活，不会取消最小化；这里直接用 AppKit 的 deminiaturize 恢复。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }

[profile.release]
opt-level = 3

# 字幕检测用的推理库在未优化构建下极慢，这里把依赖统一做优化，开发/测试时才跑得动。
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
